x-app: &app
  user: "${HOST_UID}:${HOST_GID}"
  networks:
    - network

services:
  ai:
    <<: *app
    build:
      context: .
      dockerfile: containers/ai/local/Dockerfile
    working_dir: /ai
    volumes:
      - .:/ai
      - /dev/null:/ai/.env.ai.local:ro
    env_file: .env.ai.local
    command: /bin/bash -c "
      bash"
    tty: true
    stdin_open: true

  db:
    image: postgres:18.6-bookworm
    volumes:
      - postgres:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    tty: true
    stdin_open: true
    networks:
      - network
    healthcheck:
      test: "psql -U postgres -c 'SELECT 1' || exit 1"
      start_period: 5s
      interval: 2s
      timeout: 5s
      retries: 5

  api:
    <<: *app
    build:
      context: .
      dockerfile: containers/api/local/Dockerfile
    working_dir: /api
    volumes:
      - ./api:/api
    env_file: .env.api.local
    command: /bin/bash -c "
      pnpm install;
      pnpm dev"
    ports:
      - "3000:3000"
    tty: true
    stdin_open: true
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    build:
      context: .
      dockerfile: containers/web/local/Dockerfile
    working_dir: /web
    # api/ は RPC の型 (api/rpc-types/) を参照するためだけに読み取り専用で含める。
    # web/ と api/ をリポジトリと同じ並びにして、web/ からの相対パスで型を import できるようにする
    volumes:
      - ./web:/web
      - ./api:/api:ro
    environment:
      # コンテナはホストの UID で動き、passwd にユーザーがないため、HOME を明示する (pnpm のストア用)
      HOME: /web
      # 開発サーバーが /api と /ws を中継する先
      API_URL: http://api:3000
    command: /bin/bash -c "
      pnpm install;
      pnpm dev"
    ports:
      - "5173:5173"
    tty: true
    stdin_open: true
    depends_on:
      - api

volumes:
  postgres:

networks:
  network:
